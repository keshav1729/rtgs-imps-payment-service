spring:
  application:
    name: rtgs-imps-payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rtgs_imps_db}
    username: ${DB_USERNAME:keshavmittal}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  outbox:
    enabled: true
    poll-delay-ms: 1000
  kafka:
    payment-topic: payment-events
